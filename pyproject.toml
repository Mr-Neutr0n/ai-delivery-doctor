[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-delivery-doctor"
version = "0.1.0"
description = "Evidence-first acceptance checks for AI application delivery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Yazhou Li"}]
keywords = [
  "ai",
  "agent",
  "fde",
  "delivery",
  "acceptance",
  "diagnostics",
  "mcp",
  "rag"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing"
]

[project.urls]
Homepage = "https://github.com/Yazhou-Li/ai-delivery-doctor"
Repository = "https://github.com/Yazhou-Li/ai-delivery-doctor"
Issues = "https://github.com/Yazhou-Li/ai-delivery-doctor/issues"

[project.scripts]
aidoc = "aidoc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
